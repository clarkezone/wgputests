[package]
name = "native-3d-app"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
egui = "0.36.2"
egui-wgpu = "0.36.2"
env_logger = "0.11"
glam = "0.33.9"
log = "0.4"
pollster = "1.0.1"
wgpu = "30.0.1"
winit = "0.30"

# The gallery has no text input. Avoid clipboard worker threads on Linux; the
# smithay-clipboard worker can segfault while tearing down a Wayland window.
[target.'cfg(target_os = "linux")'.dependencies]
egui-winit = { version = "0.36.2", default-features = false, features = ["links", "wayland", "x11"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
egui-winit = "0.36.2"
