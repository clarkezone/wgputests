[package]
name = "native-3d-app"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
egui = "0.36.2"
egui-wgpu = "0.36.2"
env_logger = "0.11"
glam = "0.33.9"
log = "0.4"
pollster = "1.0.1"
wgpu = "30.0.1"
winit = "0.30"

# The lab has numeric controls, not clipboard-dependent content. Avoid the
# Wayland clipboard worker, which can segfault during native window teardown.
[target.'cfg(target_os = "linux")'.dependencies]
egui-winit = { version = "0.36.2", default-features = false, features = ["links", "wayland", "x11"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
egui-winit = "0.36.2"
